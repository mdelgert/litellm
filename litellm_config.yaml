# LiteLLM Proxy Configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

# ── General Settings ─────────────────────────────────────────
general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"  # set in .env
  database_url: "os.environ/DATABASE_URL"

  # Store spend/key data in Postgres
  store_model_in_db: true

  # Allow teams / users to be managed via the UI
  allow_user_auth: true

  # Security: disable routes you don't need
  # disable_reset_budget: true

# ── Router / Load Balancing ──────────────────────────────────
router_settings:
  routing_strategy: latency-based-routing  # or: simple-shuffle, cost-based
  redis_host: "os.environ/REDIS_HOST"
  redis_port: 6379
  redis_password: "os.environ/REDIS_PASSWORD"

# ── Caching ──────────────────────────────────────────────────
litellm_settings:
  # Enable semantic / exact caching via Redis
  cache: true
  cache_params:
    type: redis
    host: "os.environ/REDIS_HOST"
    port: 6379
    password: "os.environ/REDIS_PASSWORD"
    ttl: 600           # seconds – cache TTL for exact matches
    # semantic_cache: true   # uncomment to enable semantic caching

  # Drop unsupported params instead of erroring
  drop_params: true

  # Set a global request timeout (seconds)
  request_timeout: 600

  # Fallback behaviour
  num_retries: 3
  fallbacks:
    - gpt-4o:
        - gpt-4-turbo
        - gpt-3.5-turbo

  # Callbacks – add "langfuse", "s3", "prometheus", etc. as needed
  success_callback: []
  failure_callback: []

# ── Rate Limits (global defaults) ────────────────────────────
# Override per-key or per-user via the UI or API
# max_budget: 10           # USD – total lifetime budget
# budget_duration: "1d"    # reset interval: 1d, 7d, 30d, etc.

# ── Model Definitions ─────────────────────────────────────────
# Add or remove models to match your provider keys.
# Use "os.environ/VAR_NAME" to read API keys from the environment.
model_list:

  # ── Azure OpenAI (uncomment if using Azure) ──────────────────
  - model_name: model-router
    litellm_params:
      model: openai/model-router
      api_base: "os.environ/AZURE_API_BASE"
      api_key: "os.environ/AZURE_API_KEY"
  
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: "os.environ/AZURE_API_KEY"
      api_base: "os.environ/AZURE_API_BASE"

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: "os.environ/AZURE_API_KEY"
      api_base: "os.environ/AZURE_API_BASE"

